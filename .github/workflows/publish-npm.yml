name: Publish npm

on:
  push:
    tags:
      - "v*.*.*"
  # Recovery path when an atomic branch-plus-tag push does not emit a tag push event.
  # Dispatch this workflow against the release tag; the version check rejects any other ref.
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    name: Publish trusted package
    if: >-
      github.repository == 'CorgiCorner/bisibility-mcp' &&
      vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true' &&
      startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc.')
    runs-on: ${{ github.repository != 'CorgiCorner/bisibility-mcp' && vars.CI_USE_DEPOT == 'true' && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: npm

    steps:
      - name: Checkout public release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Verify signed stable tag and current native candidate CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/verify_release_publication.py

      - name: Validate release with the development toolchain
        run: |
          (cd "$RUNNER_TEMP" && npm install --global npm@10.9.3)
          npm ci
          npm run check
          npm run build
          npm audit --audit-level=high
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Publish through npm trusted publishing
        run: |
          (cd "$RUNNER_TEMP" && npm install --global npm@11.5.1)
          npm --force publish --ignore-scripts --access public
